services:
  kei-api:
    build: .
    container_name: kei-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    environment:
      - KEI_API_TOKEN=${KEI_API_TOKEN:-test-token}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
