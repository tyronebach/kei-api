services:
  kei-api:
    build: .
    container_name: kei-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data:/app/data
    environment:
      - KEI_API_TOKEN=${KEI_API_TOKEN:-test-token}
      - KEI_VALID_SCOPES=${KEI_VALID_SCOPES:-["salon","home"]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - household-net

networks:
  household-net:
    external: true
    name: household-net
